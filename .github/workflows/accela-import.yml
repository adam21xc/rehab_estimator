name: Accela hourly import
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      start:
        description: 'Optional first filing date (YYYY-MM-DD)'
        required: false
      end:
        description: 'Optional last filing date (YYYY-MM-DD)'
        required: false
      max_details:
        description: 'Maximum detail pages this run'
        default: '150'
        required: false
permissions:
  contents: read
concurrency:
  group: accela-indy-import
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Test parser
        run: python3 -m unittest discover -s tests/accela -v
      - name: Import cases
        env:
          SUPABASE_URL: ${{ secrets.ACCELA_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.ACCELA_SUPABASE_SERVICE_ROLE_KEY }}
          START_DATE: ${{ inputs.start }}
          END_DATE: ${{ inputs.end }}
          MAX_DETAILS: ${{ inputs.max_details }}
        shell: bash
        run: |
          args=(--max-details "${MAX_DETAILS:-150}" --max-seconds 2700)
          if [[ -n "$START_DATE" ]]; then args+=(--start "$START_DATE"); fi
          if [[ -n "$END_DATE" ]]; then args+=(--end "$END_DATE"); fi
          python3 scripts/accela/import_cases.py "${args[@]}"
