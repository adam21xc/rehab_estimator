name: Accela hourly import
on:
  schedule:
    # Covers 7 a.m.–7 p.m. Pacific across PST/PDT; the gate handles DST.
    - cron: '17 0-2,14-23 * * *'
  workflow_dispatch:
    inputs:
      start:
        description: 'Optional first filing date (YYYY-MM-DD)'
        required: false
      end:
        description: 'Optional last filing date (YYYY-MM-DD)'
        required: false
      max_details:
        description: 'Maximum detail pages this run'
        default: '150'
        required: false
permissions:
  contents: read
concurrency:
  group: accela-indy-import
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Check Pacific operating hours
        id: hours
        env:
          EVENT_NAME: ${{ github.event_name }}
        shell: bash
        run: |
          hour=$(TZ=America/Los_Angeles date +%H)
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]] || (( 10#$hour >= 7 && 10#$hour < 19 )); then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Outside 7 a.m.–7 p.m. Pacific; skipping automatic import."
          fi
      - if: steps.hours.outputs.enabled == 'true'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Test parser
        if: steps.hours.outputs.enabled == 'true'
        run: python3 -m unittest discover -s tests/accela -v
      - name: Import cases
        if: steps.hours.outputs.enabled == 'true'
        env:
          SUPABASE_URL: ${{ secrets.ACCELA_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.ACCELA_SUPABASE_SERVICE_ROLE_KEY }}
          START_DATE: ${{ inputs.start }}
          END_DATE: ${{ inputs.end }}
          MAX_DETAILS: ${{ inputs.max_details }}
        shell: bash
        run: |
          args=(--max-details "${MAX_DETAILS:-150}" --max-seconds 2700)
          if [[ -n "$START_DATE" ]]; then args+=(--start "$START_DATE"); fi
          if [[ -n "$END_DATE" ]]; then args+=(--end "$END_DATE"); fi
          python3 scripts/accela/import_cases.py "${args[@]}"
